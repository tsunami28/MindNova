openapi: 3.0.3
info:
  title: MindNova Treatment Notes API
  description: >
    Treatment note management for the MindNova psychotherapy consultancy platform.
    Notes are linked to sessions and access-controlled: only the session's therapist
    or an Admin can create, read, or update notes.
  version: 1.0.0

servers:
  - url: /api
    description: Relative base path

security:
  - bearerAuth: []

paths:
  /sessions/{session_id}/notes:
    parameters:
      - name: session_id
        in: path
        required: true
        description: Session identifier
        schema:
          type: string
          format: uuid
    post:
      operationId: createNote
      summary: Create a treatment note for a session
      description: >
        Creates a note linked to the specified session. TherapistUserId is set from
        the authenticated user. Only the session's therapist or an Admin can create.
      tags: [Notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '200':
          description: >
            Created note on success, or ProblemDetails on validation/access failure.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TreatmentNoteResponse'
                  - $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid authentication token
    get:
      operationId: listSessionNotes
      summary: List treatment notes for a session
      description: >
        Returns all non-deleted notes for the specified session. Only the session's
        therapist or an Admin can access.
      tags: [Notes]
      responses:
        '200':
          description: List of notes or ProblemDetails on access failure.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/TreatmentNoteResponse'
                  - $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid authentication token

  /sessions/{session_id}/notes/{id}:
    parameters:
      - name: session_id
        in: path
        required: true
        description: Session identifier
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Treatment note identifier
        schema:
          type: string
          format: uuid
    get:
      operationId: getNote
      summary: Get a single treatment note by ID
      description: >
        Returns the note if the authenticated user is the session's therapist or an Admin.
      tags: [Notes]
      responses:
        '200':
          description: Note data or ProblemDetails (not found or access denied).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TreatmentNoteResponse'
                  - $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid authentication token

  /notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Treatment note identifier
        schema:
          type: string
          format: uuid
    put:
      operationId: updateNote
      summary: Update a treatment note's content fields
      description: >
        Updates PresentingIssue, Interventions, Homework, ProgressRating, and FreeText.
        Only the owning therapist or an Admin can update. Cannot update a deleted note.
      tags: [Notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: Updated note or ProblemDetails on failure.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TreatmentNoteResponse'
                  - $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid authentication token

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateNoteRequest:
      type: object
      required: [PresentingIssue, ProgressRating]
      properties:
        PresentingIssue:
          type: string
          maxLength: 4000
        Interventions:
          type: string
          maxLength: 4000
        Homework:
          type: string
          maxLength: 2000
        ProgressRating:
          type: integer
          minimum: 1
          maximum: 10
        FreeText:
          type: string
          maxLength: 8000

    UpdateNoteRequest:
      type: object
      properties:
        PresentingIssue:
          type: string
          maxLength: 4000
        Interventions:
          type: string
          maxLength: 4000
        Homework:
          type: string
          maxLength: 2000
        ProgressRating:
          type: integer
          minimum: 1
          maximum: 10
        FreeText:
          type: string
          maxLength: 8000

    TreatmentNoteResponse:
      type: object
      properties:
        Id:
          type: string
          format: uuid
        SessionId:
          type: string
          format: uuid
        TherapistUserId:
          type: string
        PresentingIssue:
          type: string
        Interventions:
          type: string
        Homework:
          type: string
        ProgressRating:
          type: integer
        FreeText:
          type: string
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
        IsDeleted:
          type: boolean

    ProblemDetails:
      type: object
      description: RFC 7807 error response (returned with HTTP 200 per C07)
      properties:
        Title:
          type: string
        Detail:
          type: string
        Status:
          type: integer
          description: Semantic status code (400 validation, 403 access denied, 404 not found)
        Type:
          type: string
        Instance:
          type: string
